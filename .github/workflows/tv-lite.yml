name: TV-Lite Build

on:
  workflow_dispatch:
  push:
    branches: [ tv-lite ]

concurrency:
  group: "tv-lite-build"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build TV-Lite APKs (ARM only, signed)
        run: ./gradlew assembleStableRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-tv-lite
          path: app/build/outputs/apk/stable/release/*.apk
          if-no-files-found: error
